name: Compilar APK Android (Gastitos)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # Permite ejecutar la compilación manualmente con un botón

jobs:
  build:
    name: Generar APK de Gastitos
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar dependencias
        run: npm install

      - name: Compilar aplicación web
        run: npm run build

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Sincronizar o crear proyecto Android de Capacitor
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx --yes @capacitor/assets generate --android || true
          npx cap sync android

      - name: Dar permisos de ejecución a Gradle
        run: chmod +x android/gradlew

      - name: Compilar APK en modo Debug
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Subir APK descargable
        uses: actions/upload-artifact@v4
        with:
          name: Gastitos-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
